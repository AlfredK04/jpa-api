server:
  port: 4000

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/booleandb
    username: postgres
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true